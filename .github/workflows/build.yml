name: Build images

on:
  push:
    branches: [main]
    paths:
      - "images/**"
      - "shared/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "images/**"
      - "shared/**"
  schedule:
    - cron: "0 6 * * *" # daily safety net
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      bases: ${{ steps.set.outputs.bases }}
      derived: ${{ steps.set.outputs.derived }}
      date: ${{ steps.set.outputs.date }}
    steps:
      - uses: actions/checkout@v6
      - id: set
        run: |
          bases=()
          derived=()
          for dir in images/*/; do
            img=$(basename "$dir")
            from=$(grep -m1 '^FROM ' "$dir/Containerfile" | awk '{print $2}')
            if [[ "$from" == ghcr.io/${{ github.repository }}/* ]]; then
              derived+=("$img")
            else
              bases+=("$img")
            fi
          done
          bases_json=$(printf '%s\n' "${bases[@]}" | jq -R . | jq -sc .)
          derived_json=$(printf '%s\n' "${derived[@]}" | jq -R . | jq -sc .)
          echo "bases=$bases_json"   >> "$GITHUB_OUTPUT"
          echo "derived=$derived_json" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "Base images: $bases_json"
          echo "Derived images: $derived_json"

  build:
    needs: discover
    if: needs.discover.outputs.bases != '[]'
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.discover.outputs.bases) }}
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        run: |
          echo "image_name=${{ github.repository }}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push (${{ matrix.arch }})
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./images/${{ matrix.image }}/Containerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_name }}:latest-${{ matrix.arch }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_name }}:${{ needs.discover.outputs.date }}-${{ matrix.arch }}
          platforms: linux/${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

  merge-base:
    needs: [discover, build]
    if: needs.discover.outputs.bases != '[]' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.discover.outputs.bases) }}
    steps:
      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create multi-arch manifest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}
          DATE: ${{ needs.discover.outputs.date }}
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:${DATE}" \
            "${IMAGE}:latest-amd64" \
            "${IMAGE}:latest-arm64"

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}
        run: cosign sign --yes "${IMAGE}:latest"

  build-derived:
    needs: [discover, merge-base]
    if: |
      always() &&
      needs.discover.outputs.derived != '[]' &&
      (needs.merge-base.result == 'success' || needs.merge-base.result == 'skipped')
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.discover.outputs.derived) }}
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        run: |
          echo "image_name=${{ github.repository }}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push (${{ matrix.arch }})
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./images/${{ matrix.image }}/Containerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_name }}:latest-${{ matrix.arch }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_name }}:${{ needs.discover.outputs.date }}-${{ matrix.arch }}
          platforms: linux/${{ matrix.arch }}
          # Always pull base images so the freshly-built bao-agent:latest is
          # used rather than a stale cached version from a previous dns build.
          pull: true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

  merge-derived:
    needs: [discover, build-derived]
    if: needs.discover.outputs.derived != '[]' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.discover.outputs.derived) }}
    steps:
      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create multi-arch manifest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}
          DATE: ${{ needs.discover.outputs.date }}
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:${DATE}" \
            "${IMAGE}:latest-amd64" \
            "${IMAGE}:latest-arm64"

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}
        run: cosign sign --yes "${IMAGE}:latest"
